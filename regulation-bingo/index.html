<title>Regulation Bingo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: a bingo card on the left with the bubble roller in its top-right corner and the student's buddy below it; setup and strategy screens are simple stacked panels. */
:root{
  --bg:#E4EFF0; --surface:#FFFFFF; --surface-2:#F1F7F7; --ink:#1E2A38; --muted:#566676; --line:#C7D9DC;
  --gold:#E09D16; --gold-soft:#FBEBC6; --gold-ink:#3B2700;
  --blue:#2D77CC; --blue-soft:#D6E7FA; --blue-ink:#FFFFFF;
  --move:#EC6545; --move-soft:#FCE1D9; --calm:#1A958F; --calm-soft:#D3EFED; --mixed:#7656CC; --mixed-soft:#E6DEF8;
  --wake:#D9661F; --rest:#5458C2; --good:#2B9A5E;
  --skin:#EFBE96; --hair:#4A2E1E; --shirt:#4C8DDF; --pants:#30507F; --shoe:#2A2A33;
  --display:"Baloo 2","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito","Trebuchet MS",system-ui,sans-serif;
  --radius:18px; --shadow:0 8px 26px rgba(30,42,56,.14);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0F181C; --surface:#18252B; --surface-2:#1F2F36; --ink:#E8F1F2; --muted:#9EB1B8; --line:#2D4048;
  --gold:#F2B23A; --gold-soft:#3D3115; --gold-ink:#2A1C00;
  --blue:#5DA0EE; --blue-soft:#1C3350; --blue-ink:#0B1A2C;
  --move:#F5866A; --move-soft:#3E2620; --calm:#3CC3BB; --calm-soft:#163634; --mixed:#A48AF0; --mixed-soft:#2C2545;
  --wake:#F59A55; --rest:#9094F2; --good:#4CC587;
  --skin:#EFBE96; --hair:#2A1A10; --shirt:#6AA6F0; --pants:#8FA9D8; --shoe:#D7DEE6;
  --shadow:0 8px 26px rgba(0,0,0,.45); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0F181C; --surface:#18252B; --surface-2:#1F2F36; --ink:#E8F1F2; --muted:#9EB1B8; --line:#2D4048;
  --gold:#F2B23A; --gold-soft:#3D3115; --gold-ink:#2A1C00;
  --blue:#5DA0EE; --blue-soft:#1C3350; --blue-ink:#0B1A2C;
  --move:#F5866A; --move-soft:#3E2620; --calm:#3CC3BB; --calm-soft:#163634; --mixed:#A48AF0; --mixed-soft:#2C2545;
  --wake:#F59A55; --rest:#9094F2; --good:#4CC587;
  --skin:#EFBE96; --hair:#2A1A10; --shirt:#6AA6F0; --pants:#8FA9D8; --shoe:#D7DEE6;
  --shadow:0 8px 26px rgba(0,0,0,.45); color-scheme:dark }

[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.45;margin:0;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:disabled{cursor:default;opacity:.45}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
h1,h2,h3{font-family:var(--display);line-height:1.05;margin:0;text-wrap:balance}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:8px 12px;width:100%}
.wrap{max-width:1200px;margin:0 auto;padding-block:12px 60px}

/* top bar */
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:space-between;padding-block:4px 14px}
.brand{display:flex;align-items:center;gap:10px}
.brand h1{font-size:clamp(1.7rem,4.6vw,2.5rem);font-weight:800;letter-spacing:-.01em}
.brand .mark{display:grid;grid-template-columns:repeat(2,14px);gap:3px}
.brand .mark i{width:14px;height:14px;border-radius:4px;display:block}
.brand .mark i:nth-child(1){background:var(--move)} .brand .mark i:nth-child(2){background:var(--gold)}
.brand .mark i:nth-child(3){background:var(--blue)} .brand .mark i:nth-child(4){background:var(--calm)}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 16px;border-radius:999px;font-weight:800;
  background:var(--surface);border:2px solid var(--line);min-height:44px;transition:transform .12s ease}
.btn:hover:not(:disabled){transform:translateY(-1px)}
.btn.primary{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.btn.go{background:var(--good);color:#fff;border-color:var(--good);font-size:1.1rem;padding:12px 22px}
.btn.big{font-size:1.15rem;padding:14px 26px;min-height:56px}
.btn.small{min-height:36px;padding:5px 12px;font-size:.9rem}
.chip-student{display:inline-flex;align-items:center;gap:8px;font-weight:800;padding:4px 14px 4px 4px;border-radius:999px;background:var(--surface);border:2px solid var(--line)}
.chip-student svg{width:34px;height:34px;border-radius:50%}

/* panels */
.panel{background:var(--surface);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);display:grid;gap:14px;align-content:start}
.panel h2{font-size:1.5rem}
.home{display:grid;gap:18px}
.home-grid{display:grid;gap:18px;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);align-items:start}
@media (max-width:860px){.home-grid{grid-template-columns:minmax(0,1fr)}}
.label{font-weight:800;font-size:.82rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.opt-row{display:flex;flex-wrap:wrap;gap:8px}
.opt{padding:8px 14px;border-radius:14px;border:2px solid var(--line);background:var(--surface-2);font-weight:800;min-height:44px;display:inline-flex;align-items:center;gap:6px}
.opt[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--surface)}
.deck-opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:520px){.deck-opts{grid-template-columns:minmax(0,1fr)}}
.deck-opt{border-radius:16px;padding:12px;border:3px solid transparent;text-align:left;display:grid;gap:2px;background:var(--surface-2)}
.deck-opt b{font-family:var(--display);font-size:1.25rem;line-height:1.1}
.deck-opt small{color:var(--muted);font-weight:700}
.deck-opt[data-deck="move"]{background:var(--move-soft)} .deck-opt[data-deck="calm"]{background:var(--calm-soft)} .deck-opt[data-deck="mixed"]{background:var(--mixed-soft)}
.deck-opt[aria-pressed="true"][data-deck="move"]{border-color:var(--move)} .deck-opt[aria-pressed="true"][data-deck="calm"]{border-color:var(--calm)} .deck-opt[aria-pressed="true"][data-deck="mixed"]{border-color:var(--mixed)}
.students{display:flex;flex-wrap:wrap;gap:10px}
.stu{display:grid;justify-items:center;gap:4px;padding:10px;border-radius:16px;border:3px solid var(--line);background:var(--surface-2);width:112px;font-weight:800}
.stu svg{width:76px;height:84px}
.stu[aria-pressed="true"]{border-color:var(--good);background:var(--surface)}
.stu.add{border-style:dashed;justify-content:center;align-content:center;color:var(--muted);min-height:128px}
.stu.add span{font-size:2rem;line-height:1}
.stu-name{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.buddy-pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px}
.buddy-pick button{border:3px solid var(--line);border-radius:14px;padding:4px;background:var(--surface-2);display:grid;justify-items:center;font-weight:800;font-size:.85rem}
.buddy-pick button svg{width:64px;height:70px}
.buddy-pick button[aria-pressed="true"]{border-color:var(--good)}
.tok-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:8px}
.tok-grid button{aspect-ratio:1;border-radius:14px;border:3px solid var(--line);background:var(--surface-2);display:grid;place-items:center;padding:6px}
.tok-grid button[aria-pressed="true"]{border-color:var(--ink)}
.tok-grid .tok{width:100%;height:100%}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches button{width:34px;height:34px;border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 2px var(--line)}
.swatches button[aria-pressed="true"]{box-shadow:0 0 0 3px var(--ink)}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.note{color:var(--muted);font-size:.92rem}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 12px;border-radius:12px;background:var(--surface-2);font-weight:700}

/* token rendering */
.tok{display:grid;place-items:center;line-height:1}
.tok svg{width:100%;height:100%;display:block}
.tok .emo{font-size:2rem}

/* game layout */
.game-grid{display:grid;gap:18px;grid-template-columns:minmax(0,1fr) 290px;grid-template-areas:"card roller" "card buddy";grid-template-rows:auto 1fr;align-items:start}
.area-card{grid-area:card;min-width:0}
.area-roller{grid-area:roller}
.area-buddy{grid-area:buddy}
@media (max-width:900px){.game-grid{grid-template-columns:minmax(0,1fr);grid-template-areas:"roller" "card" "buddy"}}

.msg{min-height:3.2em;display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-weight:800;font-size:1.08rem;padding:10px 16px;border-radius:14px;background:var(--surface);margin-bottom:12px;border:2px solid var(--line)}
.msg .rc{display:inline-flex;align-items:center;justify-content:center;min-width:1.7em;height:1.7em;border-radius:8px;font-family:var(--display);padding-inline:6px}
.rc.r{background:var(--gold);color:var(--gold-ink)} .rc.c{background:var(--blue);color:var(--blue-ink)}

/* bingo card */
.card{--deck:var(--move);--deck-soft:var(--move-soft);background:var(--surface);border-radius:24px;border:4px solid var(--deck);box-shadow:var(--shadow);overflow:hidden}
.card[data-deck="calm"]{--deck:var(--calm);--deck-soft:var(--calm-soft)}
.card[data-deck="mixed"]{--deck:var(--mixed);--deck-soft:var(--mixed-soft)}
.card-head{background:var(--deck);color:#fff;padding:10px 18px;display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.card-head h2{font-size:clamp(1.4rem,3.4vw,2rem);letter-spacing:.02em}
.card-head span{font-weight:800;opacity:.92}
.grid{--n:4;display:grid;grid-template-columns:2.1rem repeat(var(--n),minmax(0,1fr));gap:8px;padding:12px 14px 16px 8px;background:var(--deck-soft)}
.hd{display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:1.2rem;border-radius:10px;transition:transform .2s, box-shadow .2s}
.hd.col{background:var(--blue);color:var(--blue-ink);height:2.1rem}
.hd.row{background:var(--gold);color:var(--gold-ink)}
.hd.blank{background:none}
.hd.lit{transform:scale(1.12);box-shadow:0 0 0 4px var(--surface),0 0 0 7px currentColor}
.hd.row.lit{box-shadow:0 0 0 3px var(--surface),0 0 0 6px var(--gold)} .hd.col.lit{box-shadow:0 0 0 3px var(--surface),0 0 0 6px var(--blue)}
.cell{position:relative;aspect-ratio:1;border-radius:14px;background:var(--surface);border:2px solid var(--line);display:grid;grid-template-rows:minmax(0,1fr) auto;padding:6% 5% 5%;text-align:center;overflow:hidden;transition:transform .15s, box-shadow .2s, background .2s}
.cell:hover{transform:translateY(-2px)}
.cell .pic{position:relative;display:grid;place-items:center;min-height:0}
.cell .pic svg{position:absolute;inset:0;width:100%;height:100%}
.cell .pic .emo{font-size:clamp(1.4rem,4.4vw,2.8rem);line-height:1}
.cell .nm{font-weight:800;font-size:clamp(.62rem,1.35vw,.95rem);line-height:1.1;text-wrap:balance}
.cell .tg{position:absolute;top:4px;right:6px;font-size:.8rem}
.cell .badge{position:absolute;left:5px;top:4px;font-size:clamp(.7rem,1.6vw,1.1rem)}
.cell[data-d="move"]{border-top:5px solid var(--move)} .cell[data-d="calm"]{border-top:5px solid var(--calm)}
.size-5 .cell .nm{font-size:clamp(.56rem,1.1vw,.8rem)}
.size-3 .cell .nm{font-size:clamp(.75rem,1.7vw,1.15rem)}
.size-3 .cell .pic .emo{font-size:clamp(2rem,6vw,3.8rem)}
.cell.in-line{background:var(--surface-2)}
.cell.target{box-shadow:0 0 0 4px var(--gold),0 0 0 8px var(--blue);animation:glow 1s ease-in-out infinite alternate}
.cell.pickable{box-shadow:0 0 0 4px var(--good);animation:glow 1s ease-in-out infinite alternate}
.cell.covered .pic,.cell.covered .nm{opacity:.35}
.cell .token{position:absolute;inset:12%;display:grid;place-items:center;filter:drop-shadow(0 4px 4px rgba(0,0,0,.25))}
.cell .token .emo{font-size:clamp(1.8rem,6vw,3.6rem)}
.size-5 .cell .token .emo{font-size:clamp(1.4rem,4.4vw,2.6rem)}
.cell .token.drop{animation:drop .55s cubic-bezier(.3,1.5,.5,1)}
.cell.win{box-shadow:0 0 0 4px var(--good);background:var(--surface)}
.cell.free .nm{opacity:1}
@keyframes glow{from{filter:brightness(1)}to{filter:brightness(1.08)}}
@keyframes drop{0%{transform:translateY(-140%) scale(1.4);opacity:0}60%{opacity:1}100%{transform:none}}

/* roller */
.roller{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;display:grid;justify-items:center;gap:8px}
.roller h3{font-size:1.15rem}
.popper{position:relative;width:210px;height:190px}
.popper .base{position:absolute;left:5px;right:5px;bottom:0;height:62px;border-radius:24px 24px 30px 30px;background:linear-gradient(180deg,var(--mixed),color-mix(in srgb,var(--mixed) 70%,#000));box-shadow:inset 0 -6px 0 rgba(0,0,0,.18)}
.popper .base::after{content:"PRESS TO POP";position:absolute;bottom:12px;left:0;right:0;text-align:center;color:#fff;font-weight:800;font-size:.75rem;letter-spacing:.12em}
.dome{position:absolute;left:25px;top:0;width:160px;height:160px;border-radius:50%;
  background:radial-gradient(circle at 34% 28%,rgba(255,255,255,.95) 0 7%,rgba(255,255,255,.35) 13%,rgba(190,225,255,.22) 45%,rgba(120,170,220,.28) 100%);
  border:3px solid color-mix(in srgb,var(--blue) 45%,transparent);box-shadow:inset 0 -10px 24px rgba(40,90,150,.25),0 6px 14px rgba(0,0,0,.15);transition:transform .12s}
.dome:hover:not(:disabled){transform:scale(1.03)}
.dome.squish{animation:squish .35s ease}
@keyframes squish{0%{transform:scale(1)}35%{transform:scale(1.08,.86) translateY(10px)}70%{transform:scale(.97,1.05)}100%{transform:scale(1)}}
.die{position:absolute;top:58px;width:44px;height:44px;border-radius:11px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:6px;
  box-shadow:inset 0 -4px 0 rgba(0,0,0,.18),0 3px 6px rgba(0,0,0,.2);transition:transform .08s linear}
.die.gold{left:30px;background:var(--gold)} .die.blue{right:30px;background:var(--blue)}
.die i{width:8px;height:8px;border-radius:50%;place-self:center;background:transparent}
.die i.on{background:#fff;box-shadow:0 1px 0 rgba(0,0,0,.25)}
.die.gold i.on{background:var(--gold-ink)}
.roll-out{display:flex;gap:8px;align-items:center;font-weight:800;min-height:2.2em}
.roll-out .rc{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:10px}
@media (max-width:900px){.popper{width:180px;height:166px}.dome{left:20px;width:140px;height:140px}.die{top:48px}.die.gold{left:24px}.die.blue{right:24px}.popper .base{height:56px}}

/* buddy */
.buddy-panel{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;display:grid;justify-items:center;gap:8px;text-align:center}
.buddy-panel svg.buddy{width:200px;height:220px;max-width:100%}
.buddy-panel .meta{color:var(--muted);font-weight:700;font-size:.92rem}
.prize{animation:bounce 1s ease-in-out infinite}
@keyframes bounce{50%{transform:translateY(-4px)}}

/* overlay */
.overlay{position:fixed;inset:0;background:rgba(10,20,28,.55);display:grid;place-items:center;z-index:50;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet{background:var(--surface);border-radius:26px;box-shadow:var(--shadow);width:min(640px,100%);max-height:100%;overflow:auto;border-top:12px solid var(--deck,var(--mixed))}
.sheet.wide{width:min(900px,100%)}
.sheet[data-deck="move"]{--deck:var(--move);--deck-soft:var(--move-soft)} .sheet[data-deck="calm"]{--deck:var(--calm);--deck-soft:var(--calm-soft)}
.sheet-in{padding:20px 22px 22px;display:grid;gap:14px}
.strat-top{display:grid;grid-template-columns:150px minmax(0,1fr);gap:18px;align-items:center}
@media (max-width:520px){.strat-top{grid-template-columns:minmax(0,1fr)}.strat-top .bigpic{width:150px;justify-self:center}}
.bigpic{position:relative;aspect-ratio:1;border-radius:20px;background:var(--deck-soft,var(--surface-2));display:grid;place-items:center;padding:10px}
.bigpic svg{width:100%;height:100%}
.bigpic .emo{font-size:5rem;line-height:1}
.bigpic .badge{position:absolute;right:8px;bottom:6px;font-size:2rem}
.strat-name{font-size:clamp(1.8rem,5vw,2.6rem)}
.tagpill{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:.9rem;padding:3px 12px;border-radius:999px;color:#fff;width:max-content}
.tagpill.up{background:var(--wake)} .tagpill.calm{background:var(--rest)} .tagpill.both{background:linear-gradient(90deg,var(--wake),var(--rest))}
.steps{margin:0;padding-left:1.4em;display:grid;gap:8px;font-size:1.18rem;font-weight:700}
.steps li::marker{font-family:var(--display);font-weight:800;color:var(--deck,var(--mixed))}
.timer{display:grid;justify-items:center;gap:10px;padding:14px;border-radius:18px;background:var(--surface-2)}
.ball{width:120px;height:120px;border-radius:50%;background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--deck,var(--calm)) 50%,#fff),var(--deck,var(--calm)));transform:scale(.5);transition:transform 4s ease-in-out;display:grid;place-items:center}
.ball.in{transform:scale(1)}
.tnum{font-family:var(--display);font-size:4rem;font-weight:800;line-height:1}
.tsay{font-weight:800;font-size:1.25rem}
.did{font-size:1.25rem}
.covered-note{font-weight:800;color:var(--good)}

/* closet */
.closet-grid{display:grid;gap:14px}
.slot h3{font-size:1.15rem;margin-bottom:6px}
.acc-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.acc{position:relative;border-radius:16px;border:3px solid var(--line);background:var(--surface-2);padding:6px;display:grid;justify-items:center;gap:2px;font-weight:800;font-size:.85rem}
.acc svg{width:84px;height:92px}
.acc .flag{position:absolute;top:4px;right:4px;font-size:.7rem;padding:1px 7px;border-radius:999px;background:var(--good);color:#fff}
.acc .flag.wear{background:var(--blue);color:var(--blue-ink)}
.acc.wearing{border-color:var(--blue)}
.acc.locked svg{opacity:.3;filter:grayscale(1)}
.bingo-word{font-size:clamp(3rem,12vw,5.5rem);text-align:center;color:var(--good);letter-spacing:.04em}

/* strategies screen */
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.slist{display:grid;gap:8px}
.srow{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:12px;align-items:center;padding:8px 10px;border-radius:14px;background:var(--surface-2)}
.srow .mini{width:56px;height:56px;border-radius:12px;background:var(--surface);display:grid;place-items:center;padding:3px}
.srow .mini svg{width:100%;height:100%}
.srow .mini .emo{font-size:2rem}
.srow b{font-size:1.05rem}
.srow .sub{color:var(--muted);font-size:.88rem;font-weight:700}
.star{font-size:1.5rem;line-height:1;padding:6px;border-radius:10px;color:var(--muted)}
.star[aria-pressed="true"]{color:var(--gold)}
.edit-form{grid-column:1/-1;display:grid;gap:8px;padding-top:6px}

/* figure drawings */
.fig{overflow:visible}
.fig polyline,.fig line,.fig path.f-torso{fill:none;stroke-linecap:round;stroke-linejoin:round}
.f-pants{stroke:var(--pants);stroke-width:7}
.f-sleeve{stroke:var(--shirt);stroke-width:6}
.f-arm{stroke:var(--skin);stroke-width:4.6}
.f-torso{stroke:var(--shirt);stroke-width:12}
.f-skin{fill:var(--skin)} .f-hair{fill:var(--hair)} .f-shoe{fill:var(--shoe)} .f-ink{fill:var(--ink)}
.f-face{fill:#2A1E18} .f-smile{fill:none;stroke:#2A1E18;stroke-width:.9;stroke-linecap:round}
.f-floor{stroke:var(--line);stroke-width:2.5}
.f-wall{fill:var(--line)}
.f-chair{fill:none;stroke:var(--muted);stroke-width:3.5;stroke-linecap:round}

/* confetti */
.confetti{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:10px;height:16px;border-radius:3px;animation:fall var(--t,2.6s) linear forwards}
@keyframes fall{to{transform:translate(var(--x,0),110vh) rotate(var(--r,540deg))}}

@media (max-width:600px){.size-5 .cell .tg,.size-5 .cell .badge,.size-4 .cell .badge{display:none}.grid{gap:5px;padding:10px 8px 12px 4px;grid-template-columns:1.6rem repeat(var(--n),minmax(0,1fr))}.cell{border-radius:10px}}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}.confetti{display:none}}

<script>
/* ============================================================
   STRATEGIES
   deck: move | calm      tag: up (wake up) | calm (calm down) | both
   t: optional timer — ['breath', n] guided breaths, ['hold', seconds], ['count', n]
   Change names and steps here, or in the game under Strategies.
   ============================================================ */
const STRATS = [
  // ---- Move & Stretch: Forest animals ----
  {id:'porcupine', deck:'move', tag:'up',   e:'🦔', name:'Porcupine', t:['breath',3], steps:['Sit down with your hands on the floor behind you.','Push your belly up to the sky, like a table turned upside down.','Hold for 3 breaths, then sit down slowly.']},
  {id:'bear',      deck:'move', tag:'both', e:'🐻', name:'Bear', t:['breath',3], steps:['Get on your hands and knees.','Make your back flat like a table.','Rock slowly forward and back and give a soft bear growl.']},
  {id:'owl',       deck:'move', tag:'up',   e:'🦉', name:'Owl', t:['hold',10], steps:['Squat down low with your feet apart.','Put your hands on your knees.','Turn your head slowly left and right. Say “Hoo, hoo!”']},
  {id:'rabbit',    deck:'move', tag:'calm', e:'🐰', name:'Rabbit', t:['breath',3], steps:['Kneel and tuck your head down to the floor.','Hold your hands together behind you and lift your arms up.','Take 3 slow breaths.']},
  {id:'frog',      deck:'move', tag:'up',   e:'🐸', name:'Frog', t:['count',5], steps:['Squat down wide with your knees out.','Put your hands on the floor between your feet.','Jump up high and land softly. Ribbit! Do 5 frog jumps.']},
  {id:'snake',     deck:'move', tag:'calm', e:'🐍', name:'Snake', t:['breath',3], steps:['Lie on your tummy with your hands under your shoulders.','Press up slowly and lift your chest.','Breathe in, then let it out with a long, slow hissss.']},
  {id:'chipmunk',  deck:'move', tag:'calm', e:'🐿️', name:'Chipmunk', t:['breath',3], steps:['Sit criss-cross with a tall back.','Fill your cheeks with air like a chipmunk full of nuts.','Let the air out slowly. Do it 3 times.']},
  {id:'woodpecker',deck:'move', tag:'calm', e:'🐦', name:'Woodpecker in a Tree', t:['breath',5], steps:['Stand tall on one foot.','Put your other foot on your ankle or leg (not on your knee).','Bring your hands together over your head. Hold for 5 breaths, then switch feet.']},
  {id:'skunk',     deck:'move', tag:'up',   e:'🦨', name:'Skunk', t:['count',6], steps:['Get on your hands and knees.','Lift one leg up behind you with your knee bent, like a skunk tail.','Hold for 3, then switch legs. Do 3 on each side.']},
  {id:'raccoon',   deck:'move', tag:'calm', e:'🦝', name:'Raccoon', t:['hold',10], steps:['Sit criss-cross with a tall back.','Make circles with your fingers and hold them around your eyes like a raccoon mask.','Look slowly around the room. What do you see?']},
  // ---- Move & Stretch: more animals ----
  {id:'flamingo',  deck:'move', tag:'calm', e:'🦩', name:'Flamingo', t:['hold',10], steps:['Stand tall and lift one knee up high.','Stretch your arms out like wings.','Balance for 5, then switch legs.']},
  {id:'catcow',    deck:'move', tag:'calm', e:'🐱', name:'Cat and Cow', t:['breath',5], steps:['Get on your hands and knees.','Cat: round your back up high and look at your belly.','Cow: let your belly drop and look up. Moo! Go back and forth with 5 breaths.']},
  {id:'puppy',     deck:'move', tag:'both', e:'🐶', name:'Puppy Dog', t:['breath',3], steps:['Put your hands and feet on the floor with your hips up high, like an upside-down V.','Look back at your feet.','Wag your tail (wiggle your hips)! Hold for 3 breaths.']},
  {id:'butterfly', deck:'move', tag:'calm', e:'🦋', name:'Butterfly', t:['count',10], steps:['Sit and put the bottoms of your feet together.','Hold your feet with your hands.','Gently flap your knees like butterfly wings. Flap 10 times.']},
  {id:'turtle',    deck:'move', tag:'calm', e:'🐢', name:'Turtle Shell', t:['breath',5], steps:['Kneel and sit back on your heels.','Fold forward and rest your forehead on the floor.','Rest your arms by your sides. You are safe in your shell. Take 5 slow breaths.']},
  {id:'lion',      deck:'move', tag:'up',   e:'🦁', name:'Lion’s Breath', t:['count',3], steps:['Kneel and put your hands on your knees.','Take a big breath in through your nose.','Open your mouth wide, stick out your tongue and let it out: HAAAA! Do it 3 times.']},
  {id:'crab',      deck:'move', tag:'up',   e:'🦀', name:'Crab Walk', t:['count',10], steps:['Sit with your hands on the floor behind you and feet in front.','Lift your bottom up off the floor.','Walk sideways like a crab. Take 10 steps!']},
  {id:'kangaroo',  deck:'move', tag:'up',   e:'🦘', name:'Kangaroo Hops', t:['count',10], steps:['Bend your knees and hold your hands in front like paws.','Hop, hop, hop! Land softly on your toes.','Do 10 hops.']},
  {id:'starfish',  deck:'move', tag:'up',   e:'⭐', name:'Starfish', t:['hold',8], steps:['Stand with your feet wide apart.','Stretch your arms up and out wide, like a big star.','Reach far with your fingers and toes. Hold for 8.']},
  {id:'penguin',   deck:'move', tag:'up',   e:'🐧', name:'Penguin Waddle', t:['count',10], steps:['Stand tall with your arms straight down and hands out like flippers.','Keep your knees close together.','Waddle 10 steps.']},
  {id:'gorilla',   deck:'move', tag:'calm', e:'🦍', name:'Gorilla', t:['breath',3], steps:['Stand with your feet apart and fold forward.','Let your arms and head hang loose. You can slide your hands under your toes.','Sway gently side to side for 3 slow breaths.']},
  {id:'camel',     deck:'move', tag:'up',   e:'🐪', name:'Camel', t:['breath',3], steps:['Kneel up tall.','Put your hands on your lower back.','Gently lean back and lift your chest to the sky. Hold for 3 breaths.']},
  {id:'giraffe',   deck:'move', tag:'up',   e:'🦒', name:'Giraffe', t:['hold',5], steps:['Stand up tall.','Reach your arms high over your head.','Go up on your tiptoes and stretch as tall as a giraffe. Hold for 5.']},
  {id:'eagle',     deck:'move', tag:'both', e:'🦅', name:'Flying Eagle', t:['hold',10], steps:['Stand on one foot.','Lean forward and stretch your other leg out behind you.','Spread your arms like wings and fly! Hold for 5, then switch.']},
  {id:'alligator', deck:'move', tag:'up',   e:'🐊', name:'Alligator Plank', t:['hold',10], steps:['Lie on your tummy, then push up onto your hands and toes.','Keep your body straight and strong like an alligator.','Hold for 10.']},
  {id:'horse',     deck:'move', tag:'up',   e:'🐴', name:'Galloping Horse', t:['count',10], steps:['Stand tall and hold pretend reins.','Lift your knees high, one at a time.','Gallop in place for 10 knee lifts.']},
  {id:'monkey',    deck:'move', tag:'up',   e:'🐒', name:'Monkey Shake', t:['count',10], steps:['Shake your hands.','Now shake your arms, then one leg, then the other leg.','Shake your whole body while we count to 10, then freeze!']},
  {id:'elephant',  deck:'move', tag:'up',   e:'🐘', name:'Elephant Swing', t:['count',10], steps:['Stand with your feet apart.','Hold your hands together and let your arms hang down like a trunk.','Swing your trunk side to side 10 times.']},
  // ---- Move & Stretch: movement ----
  {id:'wallpush',  deck:'move', tag:'calm', e:'🧱', name:'Wall Push-ups', t:['count',10], steps:['Stand an arm’s length from a wall.','Put your hands flat on the wall.','Bend your elbows to lean in, then push back out. Do 10.']},
  {id:'chairpush', deck:'move', tag:'calm', e:'🪑', name:'Chair Push-ups', t:['count',5], steps:['Sit in a chair and put your hands on the seat beside you.','Push down to lift your bottom a little.','Hold for 3. Do it 5 times.']},
  {id:'bighug',    deck:'move', tag:'calm', e:'🤗', name:'Big Squeeze Hug', t:['hold',5], steps:['Wrap your arms around yourself.','Squeeze tight for 5.','Let go and shake out your arms.']},
  {id:'palmpush',  deck:'move', tag:'calm', e:'🙏', name:'Palm Push', t:['count',3], steps:['Put your palms together in front of your chest.','Push your hands together hard for 5.','Relax. Do it 3 times.']},
  {id:'jacks',     deck:'move', tag:'up',   e:'🤸', name:'Jumping Jacks', t:['count',10], steps:['Jump your feet out and clap your hands up high.','Jump your feet back in and bring your hands down.','Do 10!']},
  {id:'crosscrawl',deck:'move', tag:'up',   e:'✖️', name:'Cross Crawl', t:['count',10], steps:['Stand tall.','Touch your right hand to your left knee.','Then your left hand to your right knee. Do 10 slowly.']},
  {id:'armcircles',deck:'move', tag:'both', e:'🔄', name:'Arm Circles', t:['count',10], steps:['Stretch your arms out to the sides.','Make 10 small circles forward.','Then 10 circles backward.']},
  {id:'shoulders', deck:'move', tag:'calm', e:'💪', name:'Shoulder Rolls', t:['count',5], steps:['Lift your shoulders up to your ears.','Roll them back and down.','Do 5 slow rolls.']},
  {id:'march',     deck:'move', tag:'up',   e:'🥁', name:'March in Place', t:['count',20], steps:['Stand tall and swing your arms.','March in place, lifting your knees.','March 20 steps, then stand still.']},
  {id:'sky',       deck:'move', tag:'calm', e:'☁️', name:'Reach for the Sky', t:['breath',5], steps:['Breathe in and reach your arms up high.','Breathe out and float your arms back down.','Do it 5 times.']},
  {id:'seed',      deck:'move', tag:'up',   e:'🌱', name:'Seed to Tree', t:['count',3], steps:['Curl up small like a seed.','Slowly grow taller and taller.','Reach your branches high and wave in the wind. Do it 3 times.']},
  {id:'dance',     deck:'move', tag:'up',   e:'💃', name:'Dance Party', t:['hold',20], steps:['Dance any way you like!','Keep dancing for 20 seconds.','Then freeze like a statue.']},

  // ---- Calm & Think ----
  {id:'flower',    deck:'calm', tag:'calm', e:'🌸', name:'Smell the Flower, Blow the Candle', t:['breath',3], steps:['Pretend to hold a flower. Smell it with a slow breath in through your nose.','Pretend to hold a candle. Blow it out slowly.','Do it 3 times.']},
  {id:'square',    deck:'calm', tag:'calm', e:'🟦', name:'Square Breathing', t:['breath',3], steps:['Trace a square in the air with your finger.','Breathe in up one side, hold across the top, breathe out down the other side, hold across the bottom.','Go around 3 times.']},
  {id:'fivefinger',deck:'calm', tag:'calm', e:'✋', name:'Five-Finger Breathing', t:['breath',5], steps:['Hold up one hand.','Trace up a finger as you breathe in, and down as you breathe out.','Trace all 5 fingers.']},
  {id:'balloon',   deck:'calm', tag:'calm', e:'🎈', name:'Balloon Belly', t:['breath',5], steps:['Put your hands on your belly.','Breathe in and fill your belly up like a balloon.','Breathe out slowly and let the balloon get small. Do it 5 times.']},
  {id:'bee',       deck:'calm', tag:'calm', e:'🐝', name:'Bumble Bee Hum', t:['breath',3], steps:['Close your eyes or look down.','Breathe in, then hum like a bee as you breathe out: bzzzzz.','Feel the buzz in your face. Do it 3 times.']},
  {id:'cocoa',     deck:'calm', tag:'calm', e:'☕', name:'Hot Cocoa', t:['breath',3], steps:['Hold a pretend cup of hot cocoa.','Smell it with a slow breath in.','Blow gently to cool it down. Do it 3 times.']},
  {id:'dragon',    deck:'calm', tag:'up',   e:'🐉', name:'Dragon Breath', t:['count',3], steps:['Take a big breath in.','Let it out with a big WHOOSH, like a dragon breathing fire!','Do it 3 times.']},
  {id:'bunnysniff',deck:'calm', tag:'up',   e:'🐇', name:'Bunny Sniffs', t:['count',3], steps:['Take 3 quick sniffs in through your nose, like a bunny.','Let out one long breath through your mouth.','Do it 3 times.']},
  {id:'starbreath',deck:'calm', tag:'calm', e:'⭐', name:'Star Breathing', t:['breath',5], steps:['Trace a star in the air with your finger.','Breathe in going up each point, breathe out going down.','Trace the whole star.']},
  {id:'feather',   deck:'calm', tag:'calm', e:'🪶', name:'Feather Breath', t:['breath',5], steps:['Pretend to hold a feather in front of you.','Blow so gently that the feather barely moves.','Do it 5 times.']},
  {id:'ocean',     deck:'calm', tag:'calm', e:'🌊', name:'Ocean Waves', t:['breath',5], steps:['Breathe in as a wave rolls up the beach.','Breathe out with a whoosh as the wave goes back out.','Ride 5 waves.']},
  {id:'senses',    deck:'calm', tag:'calm', e:'👀', name:'5-4-3-2-1', steps:['Name 5 things you can see.','Name 4 things you can touch and 3 things you can hear.','Name 2 things you can smell and 1 thing you can taste.']},
  {id:'listen',    deck:'calm', tag:'calm', e:'👂', name:'Listen for 3 Sounds', t:['hold',10], steps:['Be very still and quiet.','Listen carefully for 10 seconds.','Name 3 sounds you heard.']},
  {id:'roots',     deck:'calm', tag:'calm', e:'👣', name:'Roots in the Ground', t:['count',3], steps:['Sit or stand with your feet flat.','Press your feet hard into the floor, like tree roots.','Hold for 5 and notice your feet. Do it 3 times.']},
  {id:'water',     deck:'calm', tag:'calm', e:'💧', name:'Sip of Water', steps:['Get a drink of water.','Take slow sips.','Notice how cool it feels going down.']},
  {id:'lemon',     deck:'calm', tag:'calm', e:'🍋', name:'Lemon Squeeze', t:['count',3], steps:['Pretend to hold a lemon in each hand.','Squeeze as hard as you can for 5.','Drop the lemons and let your hands go soft. Do it 3 times.']},
  {id:'spaghetti', deck:'calm', tag:'calm', e:'🍝', name:'Spaghetti Body', t:['hold',5], steps:['Make your whole body stiff like dry spaghetti.','Hold for 5.','Now get floppy like cooked spaghetti. Wiggle and relax.']},
  {id:'bodycheck', deck:'calm', tag:'calm', e:'🔍', name:'Body Check', steps:['Close your eyes or look down.','Notice your feet, legs, tummy, hands, shoulders and face.','Where does your body feel tight? Where does it feel calm?']},
  {id:'sizeprob',  deck:'calm', tag:'calm', e:'📏', name:'Size of the Problem', steps:['Think of a problem, real or pretend.','Is it a tiny, medium or big problem?','Does your reaction match the size of the problem? Show a reaction that fits.']},
  {id:'nametame',  deck:'calm', tag:'calm', e:'🏷️', name:'Name It to Tame It', steps:['Notice the feeling in your body.','Name it out loud: “I feel ___.”','Naming a feeling helps it get smaller. Take one slow breath.']},
  {id:'rainbow',   deck:'calm', tag:'calm', e:'🌈', name:'End of the Rainbow', steps:['Picture a rainbow.','Follow it with your eyes, color by color, all the way to the end.','What is waiting for you at the end of the rainbow?']},

  {id:'kind',      deck:'calm', tag:'calm', e:'💬', name:'Kind Words to Myself', steps:['Put your hand on your heart.','Say something kind to yourself, like “I can do hard things.”','Say it 3 times.']},
  {id:'calmplace', deck:'calm', tag:'calm', e:'🏝️', name:'My Calm Place', t:['breath',3], steps:['Close your eyes or look down.','Picture a place where you feel calm and safe.','What do you see, hear and smell there?']},
  {id:'count10',   deck:'calm', tag:'calm', e:'🔢', name:'Slow Count to 10', t:['count',10], steps:['Breathe slowly.','Count from 1 to 10, nice and slow.','Notice how your body feels at 10.']},
  {id:'askbreak',  deck:'calm', tag:'calm', e:'🙋', name:'Ask for a Break', steps:['Practice what to say: “Can I take a break, please?”','Say it in a calm, friendly voice.','Where could you go for a break?']},
  {id:'plan',      deck:'calm', tag:'calm', e:'📝', name:'Make a Plan', steps:['Think of something that is hard for you.','What is one thing you could do to help?','Say your plan: “First I will…, then I will….”']},
  {id:'memory',    deck:'calm', tag:'calm', e:'😊', name:'Happy Memory', steps:['Think of a time you felt really happy.','Where were you? Who was with you?','Tell about it!']},
  {id:'threegood', deck:'calm', tag:'calm', e:'🌟', name:'Three Good Things', steps:['Think about today or this week.','Name 3 good things that happened.','Tiny things count too!']},
  {id:'draw',      deck:'calm', tag:'calm', e:'✏️', name:'Draw Your Feeling', steps:['Get a paper and crayon, or draw in the air.','Draw a shape or color that shows how you feel.','Tell about your drawing.']},
  {id:'thermo',    deck:'calm', tag:'calm', e:'🌡️', name:'Feelings Thermometer', steps:['Show with your hand how big your feeling is: low, middle or high.','Name the feeling.','What could help it go down one step?']},
  {id:'help',      deck:'calm', tag:'calm', e:'🤝', name:'Ask for Help', steps:['Practice what to say: “Can you help me, please?”','Who are people you can ask for help?','Name 2 helpers.']},

  {id:'joke',      deck:'calm', tag:'up',   e:'😂', name:'Tell a Joke', steps:['Think of a funny joke.','Tell it!','A good laugh wakes up your brain.']},

  {id:'weather',   deck:'calm', tag:'calm', e:'🌦️', name:'Feelings Weather', steps:['If your feelings were weather, what would they be?','Sunny, cloudy, rainy, stormy or windy?','What could help your weather change?']},
  {id:'superhero', deck:'calm', tag:'up',   e:'🦸', name:'Superhero Pose', t:['hold',5], steps:['Stand tall with your feet apart.','Put your hands on your hips and lift your chin.','Say “I am strong!” Hold for 5.']},
  {id:'colorhunt', deck:'calm', tag:'up',   e:'🎨', name:'Color Hunt', steps:['Pick a color.','Find 5 things in the room that are that color.','Point to each one.']},
];

/* Pose drawings for the Move & Stretch deck (100×100 box).
   n neck, p hips, h head, c spine bend, a arms [elbow, hand] front first, l legs [knee, foot] front first. */

function fig(id){
  const P = POSE[id]; if(!P) return '';
  const {n,p,h} = P, c = P.c || [(n[0]+p[0])/2,(n[1]+p[1])/2];
  const leg = L => `<polyline points="${p} ${L[0]},${L[1]} ${L[2]},${L[3]}" class="f-pants"/><circle cx="${L[2]}" cy="${L[3]}" r="3.4" class="f-shoe"/>`;
  const arm = A => `<line x1="${n[0]}" y1="${n[1]}" x2="${A[0]}" y2="${A[1]}" class="f-sleeve"/><polyline points="${A[0]},${A[1]} ${A[2]},${A[3]}" class="f-arm"/><circle cx="${A[2]}" cy="${A[3]}" r="2.8" class="f-skin"/>`;
  let s = `<svg class="fig" viewBox="0 0 100 100" aria-hidden="true">`;
  if(P.floor) s += `<line x1="4" y1="97" x2="96" y2="97" class="f-floor"/>`;
  if(P.wall) s += `<rect x="84" y="8" width="10" height="89" rx="2" class="f-wall"/>`;
  if(P.chair) s += `<path d="M30,70 H70 M33,70 V96 M67,70 V96 M30,70 V40" class="f-chair"/>`;
  s += `<g class="f-back">${leg(P.l[1])}${arm(P.a[1])}</g>`;
  s += `<path d="M${n} Q${c} ${p}" class="f-torso"/>`;
  s += leg(P.l[0]);
  const [hx,hy] = h;
  s += `<circle cx="${hx}" cy="${hy-1.3}" r="8.2" class="f-hair"/><circle cx="${hx}" cy="${hy+.5}" r="7.1" class="f-skin"/>`;
  s += `<circle cx="${hx-2.5}" cy="${hy}" r=".95" class="f-face"/><circle cx="${hx+2.5}" cy="${hy}" r=".95" class="f-face"/>`;
  if(P.mouth==='o') s += `<ellipse cx="${hx}" cy="${hy+3.6}" rx="1.9" ry="2.3" class="f-face"/>`;

let AC = null;
function ac(){ if(!AC){ try{AC = new (window.AudioContext||window.webkitAudioContext)()}catch(e){} } if(AC && AC.state==='suspended') AC.resume(); return AC; }
function tone(f, dur=.15, type='sine', vol=.18, when=0, f2){
  if(!store.sound) return; const a = ac(); if(!a) return;
  const t = a.currentTime + when, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); if(f2) o.frequency.exponentialRampToValueAtTime(f2, t+dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t+dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t+dur+.02);
}
const SFX = {
  pop(){ tone(220,.18,'sine',.3,0,60); tone(900,.05,'square',.05) },
  rattle(){ for(let i=0;i<9;i++) tone(500+Math.random()*700,.04,'square',.05,i*.08) },
  plop(){ tone(700,.16,'sine',.25,0,260); tone(1200,.08,'triangle',.08,.08) },
  tick(){ tone(1100,.05,'triangle',.12) },
  chime(){ tone(880,.25,'sine',.18); tone(1320,.35,'sine',.14,.12) },
  miss(){ tone(330,.18,'triangle',.15); tone(262,.25,'triangle',.15,.15) },
  fanfare(){ [523,659,784,1047,784,1047].forEach((f,i)=>tone(f,.22,'triangle',.18,i*.13)) },
};
function say(text){ try{ speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.rate = .9; speechSynthesis.speak(u); }catch(e){} }

/* ---------- DEALING A CARD ---------- */
function pickFrom(list, k, energy){
  const pref = energy==='calm' ? s => s.tag!=='up' : energy==='up' ? s => s.tag!=='calm' : null;
  if(!pref) return shuffle(list).slice(0,k);
  const yes = shuffle(list.filter(pref)), no = shuffle(list.filter(s=>!pref(s)));
  const nYes = Math.min(yes.length, Math.round(k*.75));
  let out = yes.slice(0,nYes).concat(no.slice(0,k-nYes));
  if(out.length<k) out = out.concat(yes.slice(nYes, nYes + k - out.length));
  return out;
}
function deal(){
  const su = store.setup, st = cur(), n = su.size, free = n===5;
  const count = n*n - (free?1:0);
  const pool = STRATS.map(s=>S(s.id)).filter(s => su.deck==='mixed' || s.deck===su.deck);
  const starred = shuffle(pool.filter(s => (st.stars||[]).includes(s.id))).slice(0,count);
  const rest = pool.filter(s => !starred.includes(s));
  const need = count - starred.length;
  let picked;
  if(su.deck==='mixed'){
    const k1 = Math.ceil(need/2);
    picked = pickFrom(rest.filter(s=>s.deck==='move'), k1, su.energy).concat(pickFrom(rest.filter(s=>s.deck==='calm'), need-k1, su.energy));
  } else picked = pickFrom(rest, need, su.energy);
  const ids = shuffle(starred.concat(picked)).map(s=>s.id);
  const cells = ids.map(id => ({id, covered:false}));
  if(free) cells.splice(12, 0, {id:'free', covered:true, free:true});
  st.game = {deck:su.deck, energy:su.energy, size:n, cells, lines:[], pending:0, token:{...su.token}, blackout:false, roll:null, pick:null};
  save();
}
function gameDone(g){ return g.cells.every(c=>c.covered) && !g.pending; }

function lines(n){
  const L = [];
  for(let r=0;r<n;r++) L.push({k:'r'+r, cells:[...Array(n)].map((_,c)=>r*n+c)});
  for(let c=0;c<n;c++) L.push({k:'c'+c, cells:[...Array(n)].map((_,r)=>r*n+c)});
  L.push({k:'d1', cells:[...Array(n)].map((_,i)=>i*n+i)});
  L.push({k:'d2', cells:[...Array(n)].map((_,i)=>i*n+(n-1-i))});
  if(n>3) L.push({k:'corners', cells:[0,n-1,n*(n-1),n*n-1]});
  return L;
}

  const g = cur().game; const els = document.querySelectorAll('#grid .cell');

/* dice */
const PIPS = {1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
function drawDie(el, v){ el.innerHTML = [...Array(9)].map((_,i)=>`<i class="${PIPS[v].includes(i)?'on':''}"></i>`).join(''); }
function drawDice(r,c){ drawDie($('#dieR'), r); drawDie($('#dieC'), c); }
let rolling = false;
function roll(){
  const st = cur(), g = st.game; if(rolling || !g) return;
  if(g.pending){ openCloset('earn'); return; }
  if(g.cells.every(c=>c.covered)) return;
  rolling = true; g.pick = null; g.roll = null; clearRollMarks();
  const dome = $('#dome'); dome.classList.remove('squish'); void dome.offsetWidth; dome.classList.add('squish');
  SFX.pop(); setTimeout(SFX.rattle, 120);
  const n = g.size, dr = $('#dieR'), dc = $('#dieC');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let k = 0; const frames = reduce ? 1 : 13;
  $('#rollOut').innerHTML = `<span class="note">Rolling…</span>`;
  const step = () => {
    k++;
    drawDice(1+Math.floor(Math.random()*n), 1+Math.floor(Math.random()*n));
    if(!reduce){
      dr.style.transform = `translate(${(Math.random()*40-12)|0}px,${(Math.random()*50-28)|0}px) rotate(${(Math.random()*360)|0}deg)`;
      dc.style.transform = `translate(${(Math.random()*40-28)|0}px,${(Math.random()*50-22)|0}px) rotate(${(Math.random()*360)|0}deg)`;
    }
    if(k<frames) setTimeout(step, 70);
    else {
      const r = 1+Math.floor(Math.random()*n), c = 1+Math.floor(Math.random()*n);
      dr.style.transform = dc.style.transform = '';
      drawDice(r,c); g.roll = {r,c}; save(); rolling = false; afterRoll();
    }
  };
  step();
}
function afterRoll(){
  const g = cur().game, {r,c} = g.roll, n = g.size, i = (r-1)*n + (c-1);
  applyRollMarks();
  const cell = g.cells[i];
  if(!cell.covered){ SFX.chime(); rollMessage(); setTimeout(()=>openStrat(i), 750); return; }
  const open = [];
  for(let k=0;k<n;k++){ const a=(r-1)*n+k, b=k*n+(c-1); if(!g.cells[a].covered) open.push(a); if(!g.cells[b].covered && !open.includes(b)) open.push(b); }
  if(open.length){ g.pick = open; SFX.miss(); } else { SFX.miss(); }
  save(); applyRollMarks(); rollMessage();
}
function rollMessage(){
  const g = cur().game; if(!g.roll) return;
  const {r,c} = g.roll, n = g.size, i=(r-1)*n+(c-1), cell = g.cells[i];
  $('#rollOut').innerHTML = `<span class="rc r">Row ${r}</span><span class="rc c">Column ${c}</span>`;
  if(!cell.covered) setMsg(`<span class="rc r">${r}</span><span class="rc c">${c}</span> ${esc(S(cell.id).name)}! Show it on camera.`);
  else if(g.pick && g.pick.length) setMsg(`<span class="rc r">${r}</span><span class="rc c">${c}</span> is already covered. Pick any open square in gold row ${r} or blue column ${c}.`);
  else setMsg(`<span class="rc r">${r}</span><span class="rc c">${c}</span> Row ${r} and column ${c} are full. Pop again!`);
}
function clearRollMarks(){ document.querySelectorAll('.lit,.target,.pickable,.in-line').forEach(e=>e.classList.remove('lit','target','pickable','in-line')); }
function applyRollMarks(){
  clearRollMarks(); const g = cur().game; if(!g.roll) return;
  const {r,c} = g.roll, n = g.size;
  const rh = document.querySelector(`.hd.row[data-row="${r}"]`), ch = document.querySelector(`.hd.col[data-col="${c}"]`);
  rh && rh.classList.add('lit'); ch && ch.classList.add('lit');
  const els = document.querySelectorAll('#grid .cell');
  for(let k=0;k<n;k++){ els[(r-1)*n+k].classList.add('in-line'); els[k*n+(c-1)].classList.add('in-line'); }
  const i = (r-1)*n+(c-1);
  if(!g.cells[i].covered) els[i].classList.add('target');
  (g.pick||[]).forEach(j => els[j].classList.add('pickable'));
}

/* strategy card */
let timerRun = 0;
function openStrat(i){
  const g = cur().game, cell = g.cells[i];
  if(cell.free) return;
  const s = S(cell.id);
  const sheet = $('#sheet'); sheet.className = 'sheet'; sheet.dataset.deck = s.deck;
  const t = s.t;
  const tLabel = !t ? '' : t[0]==='breath' ? `▶ Breathe together (${t[1]})` : t[0]==='hold' ? `▶ Hold timer (${t[1]} seconds)` : `▶ Count together (${t[1]})`;
  sheet.innerHTML = `<div class="sheet-in">
    <div class="strat-top"><div class="bigpic">${pic(s)}</div>
      <div style="display:grid;gap:8px"><span class="tagpill ${s.tag}">${TAG[s.tag][0]} ${TAG[s.tag][1]}</span><h2 class="strat-name" id="sTitle">${esc(s.name)}</h2></div></div>
    <ol class="steps">${s.steps.map(x=>`<li>${esc(x)}</li>`).join('')}</ol>
    ${t ? `<div class="timer" id="timer"><button class="btn" data-act="timer">${tLabel}</button></div>` : ''}
    <div class="actions">
      ${cell.covered ? `<span class="covered-note">✓ Already done on this card</span>` : `<button class="btn go did" data-act="did" data-i="${i}">✓ They did it!</button>`}
      <button class="btn" data-act="read">🔊 Read aloud</button>
      <button class="btn" data-act="close">${cell.covered?'Close':'Not now'}</button>
    </div></div>`;
  sheet.setAttribute('aria-labelledby','sTitle');
  sheet._strat = s;
  openOverlay(sheet.querySelector('.did') || sheet.querySelector('[data-act="close"]'));
}
function openOverlay(focusEl){ $('#overlay').hidden = false; document.body.style.overflow='hidden'; setTimeout(()=>focusEl && focusEl.focus(), 30); }
function closeOverlay(){ $('#overlay').hidden = true; document.body.style.overflow=''; timerRun++; try{speechSynthesis.cancel()}catch(e){} }
const wait = ms => new Promise(r => setTimeout(r, ms));
async function runTimer(){
  const s = $('#sheet')._strat, t = s.t, box = $('#timer'), run = ++timerRun;
  const alive = () => run===timerRun && !$('#overlay').hidden;
  if(t[0]==='breath'){
    box.innerHTML = `<div class="ball" id="ball"></div><div class="tsay" id="tsay">Get ready…</div>`;
    const ball = $('#ball'), tsay = $('#tsay'); await wait(800);
    for(let b=1;b<=t[1];b++){
      if(!alive()) return; ball.classList.add('in'); tsay.textContent = `Breathe in… (${b} of ${t[1]})`; tone(392,.5,'sine',.08); await wait(4000);
      if(!alive()) return; ball.classList.remove('in'); tsay.textContent = `Breathe out…`; tone(294,.5,'sine',.08); await wait(4200);
    }
  } else if(t[0]==='hold'){
    box.innerHTML = `<div class="tnum" id="tnum">${t[1]}</div><div class="tsay">Hold it…</div>`;
    for(let k=t[1];k>0;k--){ if(!alive()) return; $('#tnum').textContent = k; SFX.tick(); await wait(1000); }
  } else {
    box.innerHTML = `<div class="tnum" id="tnum">0</div><div class="tsay">Count with me!</div>`;
    for(let k=1;k<=t[1];k++){ if(!alive()) return; $('#tnum').textContent = k; SFX.tick(); await wait(1500); }
  }
  if(!alive()) return;
  SFX.chime(); box.innerHTML = `<div class="tsay">Great job! 🎉</div><button class="btn small" data-act="timer">Do it again</button>`;
}
function did(i){
  const st = cur(), g = st.game; i = +i;
  closeOverlay();
  g.cells[i].covered = true; g.pick = null; g.roll = null; save();
  renderGame();
  const el = document.querySelectorAll('#grid .cell')[i];
  const tk = el.querySelector('.token'); tk && tk.classList.add('drop');
  SFX.plop();
  setTimeout(checkBingo, 650);
}
function checkBingo(){
  const st = cur(), g = st.game;
  const fresh = lines(g.size).filter(l => !g.lines.includes(l.k) && l.cells.every(i => g.cells[i].covered));
  let prizes = fresh.length, black = false;
  if(!g.blackout && g.cells.every(c=>c.covered)){ g.blackout = true; black = true; prizes += 3; }
  if(!prizes) return;
  fresh.forEach(l => g.lines.push(l.k));
  g.pending += prizes; st.bingos = (st.bingos||0) + fresh.length; save();
  renderGame(); confetti(); SFX.fanfare();
  const sheet = $('#sheet'); sheet.className = 'sheet'; delete sheet.dataset.deck;
  const what = black ? 'a BLACKOUT' : fresh.length>1 ? `${fresh.length} bingos at once` : 'a bingo';
  sheet.innerHTML = `<div class="sheet-in" style="justify-items:center;text-align:center">
    <h2 class="bingo-word" id="bTitle">${black?'BLACKOUT!':'BINGO!'}</h2>
    <p style="margin:0;font-size:1.25rem;font-weight:800">${esc(st.name)} got ${what}!<br>Pick ${g.pending>1?g.pending+' new accessories':'a new accessory'} for your ${BUDDIES[st.buddy].name}.</p>
    ${buddySVG(st.buddy, st.wearing, 'buddy')}
    <button class="btn go big" data-act="closet-earn">🎁 Open the closet</button></div>`;
  sheet.setAttribute('aria-labelledby','bTitle');
  sheet.querySelector('svg.buddy').style.cssText = 'width:160px;height:176px';
  openOverlay(sheet.querySelector('[data-act="closet-earn"]'));
}
function confetti(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const box = document.createElement('div'); box.className = 'confetti';
  const cols = ['#E8463A','#F08A24','#E5B800','#2FA35A','#2F7AD0','#8A56D0','#E0559A'];
  box.innerHTML = [...Array(110)].map(() => `<i style="left:${Math.random()*100}%;background:${cols[Math.random()*cols.length|0]};--x:${(Math.random()*200-100)|0}px;--r:${(Math.random()*900)|0}deg;--t:${(2+Math.random()*1.8).toFixed(2)}s;animation-delay:${(Math.random()*.6).toFixed(2)}s"></i>`).join('');
  document.body.appendChild(box); setTimeout(() => box.remove(), 4600);
}

/* closet */
let closetMode = 'dress';
function openCloset(mode){
  closetMode = mode; const st = cur();
  const sheet = $('#sheet'); sheet.className = 'sheet wide'; delete sheet.dataset.deck;
  renderCloset();
  openOverlay(sheet.querySelector('.acc:not([disabled])'));
}
function renderCloset(){
  const st = cur(), g = st.game, earn = closetMode==='earn' && g && g.pending>0, sheet = $('#sheet');
  const allEarned = (st.earned||[]).length >= ACCS.length;
  const groups = SLOTS.map(([slot,label]) => {
    const items = ACCS.filter(a=>a.slot===slot).map(a => {
      const have = st.earned.includes(a.id), wearing = st.wearing[slot]===a.id;
      const can = earn ? (!have || allEarned) : have;
      return `<button class="acc ${wearing?'wearing':''} ${!have&&!earn?'locked':''}" data-acc="${a.id}" ${can?'':'disabled'} aria-label="${esc(a.name)}${wearing?', wearing':''}${!have?(earn?', new':', not earned yet'):''}">
        ${buddySVG(st.buddy, {[slot]:a.id})}${esc(a.name)}
        ${wearing?'<span class="flag wear">On</span>': (!have && earn ? '<span class="flag">New</span>' : '')}${!have&&!earn?'<span class="flag" style="background:var(--muted)">🔒</span>':''}</button>`;
    }).join('');
    return `<div class="slot"><h3>${label}</h3><div class="acc-row">${items}</div></div>`;
  }).join('');
  const head = earn ? `🎁 Pick ${g.pending>1?g.pending+' prizes':'a prize'}!` : `${esc(st.name)}’s closet`;
  const sub = earn ? `Tap something new for your ${BUDDIES[st.buddy].name} to wear. It stays yours forever.` : `Tap something you’ve earned to put it on or take it off. Earn more by getting a bingo!`;
  sheet.innerHTML = `<div class="sheet-in">
    <div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap">${buddySVG(st.buddy, st.wearing, 'buddy')}
      <div style="display:grid;gap:6px;flex:1;min-width:200px"><h2 id="cTitle" style="font-size:2rem">${head}</h2><p class="note" style="margin:0;font-size:1rem">${sub}</p></div></div>
    <div class="closet-grid">${groups}</div>
    <div class="actions">${earn ? '' : `<button class="btn primary" data-act="close">Done</button>`}</div></div>`;
  sheet.setAttribute('aria-labelledby','cTitle');
  sheet.querySelector('svg.buddy').style.cssText = 'width:120px;height:132px';
}
function pickAcc(id){
  const st = cur(), g = st.game, a = ACCS.find(x=>x.id===id); if(!a) return;
  if(closetMode==='earn' && g && g.pending>0){
    if(!st.earned.includes(id)) st.earned.push(id);
    st.wearing[a.slot] = id; g.pending--; SFX.chime(); save();
    if(g.pending>0){ renderCloset(); return; }
    renderGame(); renderTop();
    const sheet = $('#sheet'), open = g.cells.some(c=>!c.covered);
    sheet.className = 'sheet';
    sheet.innerHTML = `<div class="sheet-in" style="justify-items:center;text-align:center">
      <h2 style="font-size:2.2rem" id="dTitle">Looking great!</h2>${buddySVG(st.buddy, st.wearing, 'buddy')}
      <div class="actions" style="justify-content:center">${open?`<button class="btn go big" data-act="close">Keep playing</button>`:''}<button class="btn ${open?'':'go big'}" data-act="newcard-yes">New card</button></div></div>`;
    sheet.setAttribute('aria-labelledby','dTitle');
    sheet.querySelector('svg.buddy').style.cssText = 'width:170px;height:187px';
    sheet.querySelector('.btn').focus();
    return;
  }
  if(!st.earned.includes(id)) return;
  if(st.wearing[a.slot]===id) delete st.wearing[a.slot]; else st.wearing[a.slot] = id;
  save(); renderCloset(); renderTop(); if(screen==='game') renderBuddy(); if(screen==='home') renderHome();
}

/* ---------- STRATEGIES SCREEN ---------- */
let stratTab = 'move', editing = null;
function renderStrats(){
  const st = cur();
  $('#stratNote').textContent = st ? `Tap ☆ to star a strategy for ${st.name}. Starred strategies always go on their card. Tap Edit to change the words for everyone.` : 'Choose a student on the home screen to star their favorites. Tap Edit to change the words.';
  document.querySelectorAll('#stratTabs .opt').forEach(b => b.setAttribute('aria-pressed', b.dataset.st===stratTab));
  $('#slist').innerHTML = STRATS.filter(s=>s.deck===stratTab).map(b => {
    const s = S(b.id), on = st && (st.stars||[]).includes(s.id);
    return `<div class="srow"><div class="mini">${pic(s)}</div>
      <div style="min-width:0"><b>${esc(s.name)}</b> <span class="sub">${TAG[s.tag][0]} ${TAG[s.tag][1]}${store.edits[s.id]?' · edited':''}</span><div class="sub">${esc(s.steps[0])}</div></div>
      <div class="actions" style="gap:4px"><button class="star" data-star="${s.id}" aria-pressed="${!!on}" ${st?'':'disabled'} aria-label="Star ${esc(s.name)}">${on?'★':'☆'}</button><button class="btn small" data-edit="${s.id}">Edit</button></div>
      ${editing===s.id ? `<form class="edit-form" data-form="${s.id}">
        <label class="label" for="eName">Name</label><input id="eName" value="${esc(s.name)}">
        <label class="label" for="eSteps">Steps (one per line)</label><textarea id="eSteps" rows="4">${esc(s.steps.join('\n'))}</textarea>
        <label class="label" for="eTag">Type</label><select id="eTag">${Object.keys(TAG).map(k=>`<option value="${k}" ${k===s.tag?'selected':''}>${TAG[k][0]} ${TAG[k][1]}</option>`).join('')}</select>
        <div class="actions"><button class="btn primary" type="submit">Save</button><button class="btn" type="button" data-cancel>Cancel</button>${store.edits[s.id]?`<button class="btn" type="button" data-reset="${s.id}">Reset to original</button>`:''}</div></form>` : ''}
    </div>`;
  }).join('');
}

/* ============================================================
   EVENTS
   ============================================================ */
document.addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b) return;
  const act = b.dataset.act;
  ac(); // unlock audio on first tap
  if(act==='home'){ closeOverlay(); show('home'); return; }
  if(act==='strats'){ editing=null; show('strats'); return; }
  if(act==='sound'){ store.sound = !store.sound; save(); renderTop(); return; }
  if(act==='addstu'){ openStuForm(false); return; }
  if(act==='editstu'){ openStuForm(true); return; }
  if(act==='delstu'){ confirmDel = true; renderHome(); return; }
  if(act==='delno'){ confirmDel = false; renderHome(); return; }
  if(act==='delyes'){ const id = store.cur; delete store.students[id]; store.order = store.order.filter(x=>x!==id); store.cur = store.order[0]||null; confirmDel=false; save(); renderHome(); renderTop(); return; }
  if(act==='dressup'){ if(cur()) openCloset('dress'); return; }
  if(act==='start'){ if(!cur()){ openStuForm(false); return; } deal(); show('game'); return; }
  if(act==='resume'){ show('game'); return; }
  if(act==='newcard'){ setMsg(`Start a new card? This one will be cleared. <button class="btn small go" data-act="newcard-yes">New card</button><button class="btn small" data-act="newcard-no">Keep this one</button>`); return; }
  if(act==='newcard-no'){ renderGame(); return; }
  if(act==='newcard-yes'){ closeOverlay(); const g = cur().game; if(g && g.pending){ openCloset('earn'); return; } show('home'); return; }
  if(act==='close'){ closeOverlay(); if(screen==='game') renderGame(); return; }
  if(act==='read'){ const s = $('#sheet')._strat; say(s.name + '. ' + s.steps.join(' ')); return; }
  if(act==='timer'){ runTimer(); return; }
  if(act==='did'){ did(b.dataset.i); return; }
  if(act==='closet-earn'){ openCloset('earn'); return; }
  if(b.id==='dome'){ roll(); return; }
  if(b.dataset.i!==undefined && b.classList.contains('cell')){ openStrat(+b.dataset.i); return; }
  if(b.dataset.stu){ store.cur = b.dataset.stu; confirmDel=false; save(); renderHome(); return; }
  if(b.dataset.buddy){ stuBuddy = b.dataset.buddy; renderBuddyPick(); return; }
  if(b.dataset.deck && b.closest('#deckOpts')){ store.setup.deck = b.dataset.deck; save(); renderHome(); return; }
  if(b.dataset.e){ store.setup.energy = b.dataset.e; save(); renderHome(); return; }
  if(b.dataset.s){ store.setup.size = +b.dataset.s; save(); renderHome(); return; }
  if(b.dataset.tab){ store.setup.tab = b.dataset.tab; save(); renderHome(); return; }
  if(b.dataset.tok){ const su = store.setup; su.token = su.tab==='shapes' ? {k:'shape', v:b.dataset.tok, c:su.color} : {k:'emoji', v:b.dataset.tok}; save(); renderHome(); return; }
  if(b.dataset.color){ const su = store.setup; su.color = b.dataset.color; if(su.token.k==='shape') su.token.c = su.color; save(); renderHome(); return; }
  if(b.dataset.acc){ pickAcc(b.dataset.acc); return; }
  if(b.dataset.st){ stratTab = b.dataset.st; editing=null; renderStrats(); return; }
  if(b.dataset.star){ const st = cur(); st.stars = st.stars||[]; const id=b.dataset.star; st.stars = st.stars.includes(id) ? st.stars.filter(x=>x!==id) : st.stars.concat(id); save(); renderStrats(); return; }
  if(b.dataset.edit){ editing = editing===b.dataset.edit ? null : b.dataset.edit; renderStrats(); const f=$('#eName'); f&&f.focus(); return; }
  if(b.hasAttribute('data-cancel')){ editing=null; renderStrats(); return; }
  if(b.dataset.reset){ delete store.edits[b.dataset.reset]; editing=null; save(); renderStrats(); return; }
});
document.addEventListener('submit', e => {
  const f = e.target.closest('[data-form]'); if(!f) return; e.preventDefault();
  const id = f.dataset.form, name = $('#eName').value.trim(), steps = $('#eSteps').value.split('\n').map(x=>x.trim()).filter(Boolean);
  if(!name || !steps.length) return;
  store.edits[id] = {name, steps, tag:$('#eTag').value}; editing=null; save(); renderStrats();
});
document.addEventListener('keydown', e => {
  if(e.key==='Escape' && !$('#overlay').hidden){ const g = cur() && cur().game; if(closetMode==='earn' && g && g.pending && $('#sheet').querySelector('.acc')) return; closeOverlay(); if(screen==='game') renderGame(); }
});
$('#overlay').addEventListener('click', e => { if(e.target.id==='overlay' && $('#sheet').querySelector('[data-act="close"]') && !$('#sheet').querySelector('.bingo-word')){ closeOverlay(); if(screen==='game') renderGame(); } });

/* start */
if(store.cur && !store.students[store.cur]) store.cur = store.order[0] || null;
show('home');
if(!store.order.length) openStuForm(false);
</script>
